plugins {
    id "com.android.application"
}

android {
    namespace "com.flowlink.client"
    compileSdk 35

    defaultConfig {
        applicationId "com.flowlink.client"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.3.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        buildConfigField "String", "FLOWLINK_HOST", '"101.99.68.117"'
        buildConfigField "String", "FLOWLINK_CERT_SHA256", '"94EA530BB2848E98D949190D87D67ACEC3C9ACA1F53DC68CDCE3D00958BB0F67"'
    }

    buildFeatures {
        buildConfig true
    }

    def signingPropertiesFile = file("/etc/flowlink/android-signing.properties")
    def signingProperties = new Properties()
    if (signingPropertiesFile.exists()) {
        signingProperties.load(new FileInputStream(signingPropertiesFile))
        signingConfigs {
            release {
                storeFile file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation project(":tunnel")
    implementation "androidx.core:core:1.15.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
